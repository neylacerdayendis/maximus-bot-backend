<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maximus Bot - Painel de Controle</title>
  <style>
    body { background-color: #05070D; color: #E8ECF6; font-family: Arial, sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
    .container { width: 100%; max-width: 800px; }
    .card { background: #0E1420; border: 1px solid #20293D; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .input-field { width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 16px; background: rgba(0,0,0,0.2); border: 1px solid #20293D; border-radius: 12px; color: #E8ECF6; outline: none; box-sizing: border-box; font-size: 14px; }
    .input-field:focus { border-color: #00e676; }
    .btn { width: 100%; padding: 12px; font-weight: bold; font-size: 14px; border-radius: 12px; border: none; cursor: pointer; text-align: center; }
    .btn-green { background: #28C77A; color: #121214; }
    .btn-green:hover { background: #23ab68; }
    .btn-red { background: #F0455C; color: #fff; }
    .btn-red:hover { background: #d93b51; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-box { background: #0E1420; border: 1px solid #20293D; border-radius: 12px; padding: 16px; }
    .text-sm { font-size: 12px; color: #7C8AA5; display: block; margin-bottom: 4px; }
    .text-lg { font-size: 24px; font-weight: bold; }
    .text-green { color: #28C77A; }
    .text-red { color: #F0455C; }
    .hidden { display: none !important; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid #20293D; margin-bottom: 24px; }
    .logout-btn { padding: 6px 12px; border-radius: 8px; font-size: 12px; background: transparent; border: 1px solid #20293D; color: #7C8AA5; cursor: pointer; }
    .logout-btn:hover { background: #141C2E; }
    select.input-field { cursor: pointer; }
    select.input-field:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-box { padding: 12px; margin-bottom: 16px; border-radius: 12px; font-size: 12px; background: rgba(240,69,92,0.1); color: #F0455C; border: 1px solid rgba(240,69,92,0.2); }
  </style>
</head>
<body>

  <div id="app" class="container">
    <div class="card" style="text-align: center; color: #7C8AA5;">Carregando painel...</div>
  </div>

  <script>
    const API_BASE = "/api";
    let refreshInterval = null;

    function getToken() {
      return localStorage.getItem("token");
    }

    function setToken(token) {
      localStorage.setItem("token", token);
    }

    function removeToken() {
      localStorage.removeItem("token");
      if (refreshInterval) clearInterval(refreshInterval);
    }

    async function apiFetch(path, options = {}) {
      const { token, method = "GET", body } = options;
      let res = await fetch(`${API_BASE}${path}`, {
        method,
        cache: "no-store",
        headers: {
          "Content-Type": "application/json",
          "Cache-Control": "no-cache",
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
        },
        body: body ? JSON.stringify(body) : undefined,
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.message || `Erro ${res.status}`);
      return data;
    }

    const AVAILABLE_PAIRS = ["EURUSD", "GBPUSD", "USDJPY", "AUDUSD", "USDCHF", "USDCAD", "NZDUSD", "EURGBP"];

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorDiv = document.getElementById("login-error");
      
      errorDiv.classList.add("hidden");

      try {
        const res = await apiFetch("/auth/login", { method: "POST", body: { email, password } });
        const token = res.token || res.access_token;
        if (!token) throw new Error("Token não retornado pelo servidor");
        setToken(token);
        initDashboard();
      } catch (err) {
        errorDiv.textContent = err.message || "Credenciais inválidas";
        errorDiv.classList.remove("hidden");
      }
    }

    function handleLogout() {
      removeToken();
      renderLoginScreen();
    }

    function renderLoginScreen() {
      if (refreshInterval) clearInterval(refreshInterval);
      document.getElementById("app").innerHTML = `
        <div class="card" style="max-width: 380px; margin: 0 auto;">
          <h2 style="text-align: center; color: #28C77A; margin-top: 0; margin-bottom: 4px;">MAXIMUS BOT</h2>
          <p style="text-align: center; font-size: 12px; color: #7C8AA5; margin-bottom: 24px;">Faça login para acessar o painel</p>
          
          <div id="login-error" class="error-box hidden"></div>
          
          <form id="login-form">
            <div>
              <label class="text-sm">E-mail</label>
              <input type="email" id="email" required class="input-field" placeholder="seu@email.com" />
            </div>
            <div>
              <label class="text-sm">Senha</label>
              <input type="password" id="password" required class="input-field" placeholder="********" />
            </div>
            <button type="submit" class="btn btn-green">Entrar</button>
          </form>
        </div>
      `;
      document.getElementById("login-form").addEventListener("submit", handleLogin);
    }

    async function loadDashboardData() {
      const token = getToken();
      if (!token) {
        renderLoginScreen();
        return;
      }

      try {
        const res = await apiFetch("/status", { token });
        const status = {
          running: res.running === true || res.status === 'LIGADO' || res.running === 'true',
          initial_balance: res.initial_balance ?? 1000,
          current_balance: res.current_balance ?? res.saldo ?? 1000,
          wins: res.wins ?? 0,
          losses: res.losses ?? 0,
          asset: (res.asset || res.asset_pair || 'EURUSD').toUpperCase(),
          lastEngineError: res.lastEngineError ?? null,
          lastErrorAt: res.lastErrorAt ?? null,
          events: Array.isArray(res.events) ? res.events : []
        };

        updateDashboardUI(status);
      } catch (err) {
        console.error("Erro ao buscar status:", err);
        if (err.message.includes("401") || err.message.includes("403") || err.message.includes("jwt") || err.message.includes("Unauthorized")) {
          removeToken();
          renderLoginScreen();
        }
      }
    }

    async function toggleBot() {
      const token = getToken();
      const btn = document.getElementById("btn-toggle");
      if (btn) {
        btn.textContent = "Aguarde...";
        btn.disabled = true;
      }

      try {
        const statusData = await apiFetch("/status", { token });
        const isRunning = statusData.running === true || statusData.status === 'LIGADO' || statusData.running === 'true';

        const path = isRunning ? "/stop" : "/start";
        const select = document.getElementById("pair-select");
        const selectedPair = select ? select.value : undefined;
        await apiFetch(path, {
          method: "POST",
          token,
          body: path === "/start" && selectedPair ? { asset: selectedPair } : undefined
        });
        await loadDashboardData();
      } catch (err) {
        alert("Erro ao alterar o bot: " + err.message);
        await loadDashboardData();
      }
    }

    function updateDashboardUI(status) {
      const profit = (status.current_balance - status.initial_balance).toFixed(2);
      const profitClass = profit >= 0 ? "text-green" : "text-red";
      const statusColor = status.running ? "text-green" : "text-sm";
      const btnClass = status.running ? "btn-red" : "btn-green";
      const btnText = status.running ? "PARAR BOT" : "INICIAR BOT";

      // Se o container principal ainda não tem a estrutura do dashboard, monta ela
      if (!document.getElementById("btn-toggle")) {
        document.getElementById("app").innerHTML = `
          <header>
            <div>
              <h1 style="margin: 0; font-size: 18px;">MAXIMUS BOT</h1>
              <span id="bot-status-text" style="margin-top: 4px;">● Parado</span>
            </div>
            <button id="logout-btn" class="logout-btn">Sair</button>
          </header>

          <div class="grid-3">
            <div class="stat-box">
              <span class="text-sm">Saldo Atual</span>
              <span id="val-balance" class="text-lg">R$ 1000</span>
            </div>
            <div class="stat-box">
              <span class="text-sm">Lucro / Prejuízo</span>
              <span id="val-profit" class="text-lg">R$ 0.00</span>
            </div>
            <div class="stat-box">
              <span class="text-sm">Placar (W / L)</span>
              <span id="val-score" class="text-lg">
                <span class="text-green">0</span> / <span class="text-red">0</span>
              </span>
            </div>
          </div>

          <div class="card" style="text-align: center;">
            <h2 style="font-size: 14px; color: #7C8AA5; margin-top: 0; margin-bottom: 16px;">Status da Operação</h2>
            <div id="engine-error" class="error-box hidden"></div>

            <div style="margin-bottom: 16px;">
              <label class="text-sm" style="margin-bottom: 6px;">Par de operação</label>
              <select id="pair-select" class="input-field" style="max-width: 250px; margin: 0 auto;">
                ${AVAILABLE_PAIRS.map(p => `<option value="${p}">${p}</option>`).join("")}
              </select>
            </div>

            <button id="btn-toggle" class="btn btn-green" style="max-width: 250px; padding: 14px 24px; border-radius: 9999px;">
              INICIAR BOT
            </button>
          </div>

          <div class="card" style="margin-top: 16px;">
            <h2 style="font-size: 14px; color: #7C8AA5; margin-top: 0; margin-bottom: 16px;">Histórico da Operação</h2>
            <div id="op-log" style="max-height: 320px; overflow-y: auto; text-align: left; font-size: 12px;">
              <div style="color: #7C8AA5; padding: 8px 0;">Sem eventos ainda.</div>
            </div>
          </div>
        `;
        document.getElementById("logout-btn").addEventListener("click", handleLogout);
        document.getElementById("btn-toggle").addEventListener("click", toggleBot);

        // Define o par selecionado conforme o pares ativo do servidor
        const pairSelect = document.getElementById("pair-select");
        if (pairSelect && AVAILABLE_PAIRS.includes(status.asset)) {
          pairSelect.value = status.asset;
        }
        // Desabilita a troca de par enquanto o bot estiver operando
        pairSelect.disabled = !!status.running;
      }

      // Atualiza os valores na tela sem recriar os elementos (evita piscar)
      document.getElementById("val-balance").textContent = `R$ ${status.current_balance}`;
      const profitEl = document.getElementById("val-profit");
      profitEl.textContent = `R$ ${profit}`;
      profitEl.className = `text-lg ${profitClass}`;

      document.getElementById("val-score").innerHTML = `<span class="text-green">${status.wins}</span> / <span class="text-red">${status.losses}</span>`;
      
      const statusTextEl = document.getElementById("bot-status-text");
      statusTextEl.textContent = `● ${status.running ? "Operando" : "Parado"}`;
      statusTextEl.className = status.running ? "text-green" : "text-sm";

      const btnToggle = document.getElementById("btn-toggle");
      btnToggle.className = `btn ${btnClass}`;
      btnToggle.textContent = btnText;
      btnToggle.disabled = false;

      // Reabilita (ou bloqueia) a troca de par conforme o estado do bot
      const pairSelect = document.getElementById("pair-select");
      if (pairSelect) {
        pairSelect.disabled = !!status.running;
      }

      // Mostra (ou esconde) o aviso de falha do motor de sinais
      const errEl = document.getElementById("engine-error");
      if (errEl) {
        if (status.lastEngineError) {
          const when = status.lastErrorAt ? ` (${new Date(status.lastErrorAt).toLocaleTimeString('pt-BR')})` : '';
          errEl.textContent = "Motor de sinais com problema: " + status.lastEngineError + when;
          errEl.classList.remove("hidden");
        } else {
          errEl.classList.add("hidden");
        }
      }

      // Renderiza o histórico de eventos
      renderEventLog(status.events || []);
    }

    function renderEventLog(events) {
      const logEl = document.getElementById("op-log");
      if (!logEl) return;

      if (!events.length) {
        logEl.innerHTML = `<div style="color: #7C8AA5; padding: 8px 0;">Sem eventos ainda.</div>`;
        return;
      }

      const colors = { win: "#28C77A", loss: "#F0455C", info: "#7C8AA5", error: "#F0455C" };
      const labels = { win: "WIN", loss: "LOSS", info: "INFO", error: "ERRO" };

      logEl.innerHTML = events.slice().reverse().map(ev => {
        const color = colors[ev.kind] || "#7C8AA5";
        const tag = labels[ev.kind] || ev.kind;
        const d = ev.time ? new Date(ev.time) : null;
        const time = d ? `${d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })} ${d.toLocaleTimeString('pt-BR')}` : '';
        return `<div style="display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid #141C2E; align-items: baseline;">
          <span style="color: #4E5D78; white-space: nowrap; font-size: 11px;">${time}</span>
          <span style="color: ${color}; font-weight: bold; white-space: nowrap; font-size: 11px;">${tag}</span>
          <span style="color: #C3CDE0;">${ev.message || ''}</span>
        </div>`;
      }).join("");
    }

    function initDashboard() {
      loadDashboardData();
      if (refreshInterval) clearInterval(refreshInterval);
      refreshInterval = setInterval(loadDashboardData, 5000);
    }

    // Inicialização ao carregar a página
    window.addEventListener("DOMContentLoaded", () => {
      if (getToken()) {
        initDashboard();
      } else {
        renderLoginScreen();
      }
    });
  </script>
</body>
</html>

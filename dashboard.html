<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maximus Bot - Painel de Controle</title>
  <style>
    body { background-color: #05070D; color: #E8ECF6; font-family: Arial, sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
    .container { width: 100%; max-width: 800px; }
    .card { background: #0E1420; border: 1px solid #20293D; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .input-field { width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 16px; background: rgba(0,0,0,0.2); border: 1px solid #20293D; border-radius: 12px; color: #E8ECF6; outline: none; box-sizing: border-box; font-size: 14px; }
    .input-field:focus { border-color: #00e676; }
    .btn { width: 100%; padding: 12px; font-weight: bold; font-size: 14px; border-radius: 12px; border: none; cursor: pointer; text-align: center; }
    .btn-green { background: #28C77A; color: #121214; }
    .btn-green:hover { background: #23ab68; }
    .btn-red { background: #F0455C; color: #fff; }
    .btn-red:hover { background: #d93b51; }
    .btn-blue { background: #3D7FFF; color: #fff; }
    .btn-blue:hover { background: #3267cc; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-box { background: #0E1420; border: 1px solid #20293D; border-radius: 12px; padding: 16px; }
    .text-sm { font-size: 12px; color: #7C8AA5; display: block; margin-bottom: 4px; }
    .text-lg { font-size: 24px; font-weight: bold; }
    .text-green { color: #28C77A; }
    .text-red { color: #F0455C; }
    .hidden { display: none !important; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid #20293D; margin-bottom: 24px; }
    .logout-btn { padding: 6px 12px; border-radius: 8px; font-size: 12px; background: transparent; border: 1px solid #20293D; color: #7C8AA5; cursor: pointer; }
    .logout-btn:hover { background: #141C2E; }
    .error-box { padding: 12px; margin-bottom: 16px; border-radius: 12px; font-size: 12px; background: rgba(240,69,92,0.1); color: #F0455C; border: 1px solid rgba(240,69,92,0.2); }
  </style>
</head>
<body>

  <div id="app" class="container">
    <!-- Conteúdo injetado dinamicamente -->
  </div>

  <script>
    const API_BASE = "/api";

    function getToken() {
      return localStorage.getItem("token") || sessionStorage.getItem("maximus_token");
    }

    function setToken(token) {
      localStorage.setItem("token", token);
      sessionStorage.setItem("maximus_token", token);
    }

    function removeToken() {
      localStorage.removeItem("token");
      sessionStorage.removeItem("maximus_token");
    }

    async function apiFetch(path, options = {}) {
      const { token, method = "GET", body } = options;
      let url = `${API_BASE}${path}`;
      
      let res = await fetch(url, {
        method,
        headers: {
          "Content-Type": "application/json",
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
        },
        body: body ? JSON.stringify(body) : undefined,
      });

      if (res.status === 404) {
        res = await fetch(path, {
          method,
          headers: {
            "Content-Type": "application/json",
            ...(token ? { Authorization: `Bearer ${token}` } : {}),
          },
          body: body ? JSON.stringify(body) : undefined,
        });
      }

      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.message || `Erro ${res.status}`);
      return data;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorDiv = document.getElementById("login-error");
      
      errorDiv.classList.add("hidden");

      try {
        const res = await apiFetch("/auth/login", { method: "POST", body: { email, password } });
        const token = res.token || res.access_token;
        if (!token) throw new Error("Token não retornado pelo servidor");
        setToken(token);
        loadDashboard();
      } catch (err) {
        errorDiv.textContent = err.message || "Credenciais inválidas";
        errorDiv.classList.remove("hidden");
      }
    }

    function handleLogout() {
      removeToken();
      renderLoginScreen();
    }

    async function toggleBot() {
      const token = getToken();
      const btn = document.getElementById("btn-toggle");
      if (btn) {
        btn.textContent = "Aguarde...";
        btn.disabled = true;
      }

      try {
        const statusData = await apiFetch("/status", { token });
        const s = statusData.status || statusData;
        const isRunning = s.running === true || s.status === 'LIGADO' || s.running === 'true';

        const path = isRunning ? "/stop" : "/start";
        await apiFetch(path, { method: "POST", token });
        await loadDashboard();
      } catch (err) {
        alert("Erro ao alterar o bot: " + err.message);
        await loadDashboard();
      }
    }

    function renderLoginScreen() {
      document.getElementById("app").innerHTML = `
        <div class="card" style="max-width: 380px; margin: 0 auto;">
          <h2 style="text-align: center; color: #28C77A; margin-top: 0; margin-bottom: 4px;">MAXIMUS BOT</h2>
          <p style="text-align: center; font-size: 12px; color: #7C8AA5; margin-bottom: 24px;">Faça login para acessar o painel</p>
          
          <div id="login-error" class="error-box hidden"></div>
          
          <form id="login-form">
            <div>
              <label class="text-sm">E-mail</label>
              <input type="email" id="email" required class="input-field" placeholder="seu@email.com" />
            </div>
            <div>
              <label class="text-sm">Senha</label>
              <input type="password" id="password" required class="input-field" placeholder="********" />
            </div>
            <button type="submit" class="btn btn-green">Entrar</button>
          </form>
        </div>
      `;
      document.getElementById("login-form").addEventListener("submit", handleLogin);
    }

    async function loadDashboard() {
      const token = getToken();
      if (!token) {
        renderLoginScreen();
        return;
      }

      let status = { running: false, initial_balance: 1000, current_balance: 1000, wins: 0, losses: 0 };
      try {
        const res = await apiFetch("/status", { token });
        const s = res.status || res;
        status = {
          running: s.running === true || s.status === 'LIGADO' || s.running === 'true',
          initial_balance: s.initial_balance ?? 1000,
          current_balance: s.current_balance ?? s.saldo ?? 1000,
          wins: s.wins ?? 0,
          losses: s.losses ?? 0
        };
      } catch (err) {
        console.error("Erro ao buscar status do bot:", err);
        if (err.message.includes("401") || err.message.includes("403")) {
          removeToken();
          renderLoginScreen();
          return;
        }
      }

      const profit = (status.current_balance - status.initial_balance).toFixed(2);
      const profitClass = profit >= 0 ? "text-green" : "text-red";
      const statusColor = status.running ? "text-green" : "text-sm";
      const btnClass = status.running ? "btn-red" : "btn-green";
      const btnText = status.running ? "PARAR BOT" : "INICIAR BOT";

      document.getElementById("app").innerHTML = `
        <header>
          <div>
            <h1 style="margin: 0; font-size: 18px;">MAXIMUS BOT</h1>
            <span class="${statusColor}" style="margin-top: 4px;">● ${status.running ? "Operando" : "Parado"}</span>
          </div>
          <button id="logout-btn" class="logout-btn">Sair</button>
        </header>

        <div class="grid-3">
          <div class="stat-box">
            <span class="text-sm">Saldo Atual</span>
            <span class="text-lg">R$ ${status.current_balance}</span>
          </div>
          <div class="stat-box">
            <span class="text-sm">Lucro / Prejuízo</span>
            <span class="text-lg ${profitClass}">R$ ${profit}</span>
          </div>
          <div class="stat-box">
            <span class="text-sm">Placar (W / L)</span>
            <span class="text-lg">
              <span class="text-green">${status.wins}</span> / <span class="text-red">${status.losses}</span>
            </span>
          </div>
        </div>

        <div class="card" style="text-align: center;">
          <h2 style="font-size: 14px; color: #7C8AA5; margin-top: 0; margin-bottom: 16px;">Status da Operação</h2>
          <button id="btn-toggle" class="btn ${btnClass}" style="max-width: 250px; padding: 14px 24px; border-radius: 9999px;">
            ${btnText}
          </button>
        </div>
      `;

      document.getElementById("logout-btn").addEventListener("click", handleLogout);
      document.getElementById("btn-toggle").addEventListener("click", toggleBot);
    }

    if (getToken()) {
      loadDashboard();
      setInterval(() => {
        if (getToken()) loadDashboard();
      }, 5000);
    } else {
      renderLoginScreen();
    }
  </script>
</body>
</html>

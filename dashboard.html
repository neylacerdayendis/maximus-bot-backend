<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maximus Bot - Painel</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body style="background-color: #05070D; color: #E8ECF6; margin: 0; font-family: sans-serif;">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useCallback, createElement: h } = React;

    const API_BASE = "/api";

    const C = {
      bg: "#05070D",
      surface: "#0E1420",
      border: "#20293D",
      accent: "#3D7FFF",
      success: "#28C77A",
      danger: "#F0455C",
      text: "#E8ECF6",
      muted: "#7C8AA5",
    };

    async function apiFetch(path, options = {}) {
      const { token, method = "GET", body } = options;
      let url = `${API_BASE}${path}`;
      
      let res = await fetch(url, {
        method,
        headers: {
          "Content-Type": "application/json",
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
        },
        body: body ? JSON.stringify(body) : undefined,
      });

      if (res.status === 404) {
        res = await fetch(path, {
          method,
          headers: {
            "Content-Type": "application/json",
            ...(token ? { Authorization: `Bearer ${token}` } : {}),
          },
          body: body ? JSON.stringify(body) : undefined,
        });
      }

      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.message || `Erro ${res.status}`);
      return data;
    }

    function App() {
      const [token, setToken] = useState(() => sessionStorage.getItem("maximus_token"));
      const [status, setStatus] = useState({
        running: false,
        initial_balance: 1000,
        current_balance: 1000,
        wins: 0,
        losses: 0
      });
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");
      const [loading, setLoading] = useState(false);

      const fetchStatus = useCallback(async () => {
        if (!token) return;
        try {
          const res = await apiFetch("/status", { token });
          const s = res.status || res;
          setStatus({
            running: s.running === true || s.status === 'LIGADO' || s.running === 'true',
            initial_balance: s.initial_balance ?? 1000,
            current_balance: s.current_balance ?? s.saldo ?? 1000,
            wins: s.wins ?? 0,
            losses: s.losses ?? 0
          });
        } catch (err) {
          console.error("Erro status:", err);
        }
      }, [token]);

      useEffect(() => {
        if (token) {
          fetchStatus();
          const interval = setInterval(fetchStatus, 5000);
          return () => clearInterval(interval);
        }
      }, [token, fetchStatus]);

      async function handleLogin(e) {
        e.preventDefault();
        setError("");
        setLoading(true);
        try {
          const res = await apiFetch("/auth/login", { method: "POST", body: { email, password } });
          const authToken = res.token || res.access_token;
          if (!authToken) throw new Error("Token não retornado");
          sessionStorage.setItem("maximus_token", authToken);
          setToken(authToken);
        } catch (err) {
          setError(err.message || "Credenciais inválidas");
        } finally {
          setLoading(false);
        }
      }

      function handleLogout() {
        sessionStorage.removeItem("maximus_token");
        setToken(null);
        setStatus({ running: false, initial_balance: 1000, current_balance: 1000, wins: 0, losses: 0 });
      }

      async function toggleBot() {
        setLoading(true);
        try {
          const path = status.running ? "/stop" : "/start";
          await apiFetch(path, { method: "POST", token });
          await fetchStatus();
        } catch (err) {
          alert("Erro ao alterar o bot: " + err.message);
        } finally {
          setLoading(false);
        }
      }

      if (!token) {
        return h('div', { className: "min-h-screen flex items-center justify-center p-4" },
          h('div', { className: "w-full max-w-sm p-6 rounded-2xl", style: { background: C.surface, border: `1px solid ${C.border}` } },
            h('h1', { className: "text-xl font-bold mb-1 text-center", style: { color: C.text } }, "MAXIMUS BOT"),
            h('p', { className: "text-xs text-center mb-6", style: { color: C.muted } }, "Acesso ao painel de controle"),
            error && h('div', { className: "p-3 mb-4 rounded-xl text-xs", style: { background: "rgba(240,69,92,0.1)", color: C.danger } }, error),
            h('form', { onSubmit: handleLogin, className: "space-y-4" },
              h('div', null,
                h('label', { className: "text-xs font-medium block mb-1", style: { color: C.muted } }, "E-mail"),
                h('input', { type: "email", required: true, value: email, onChange: e => setEmail(e.target.value), className: "w-full p-3 rounded-xl bg-black/20 outline-none text-sm border", style: { borderColor: C.border, color: C.text } })
              ),
              h('div', null,
                h('label', { className: "text-xs font-medium block mb-1", style: { color: C.muted } }, "Senha"),
                h('input', { type: "password", required: true, value: password, onChange: e => setPassword(e.target.value), className: "w-full p-3 rounded-xl bg-black/20 outline-none text-sm border", style: { borderColor: C.border, color: C.text } })
              ),
              h('button', { type: "submit", disabled: loading, className: "w-full py-3 rounded-xl font-bold text-sm cursor-pointer", style: { background: C.accent, color: "#000" } },
                loading ? "Entrando..." : "Entrar"
              )
            )
          )
        );
      }

      const profit = (status.current_balance - status.initial_balance).toFixed(2);

      return h('div', { className: "max-w-4xl mx-auto p-4 md:p-6 space-y-6" },
        h('header', { className: "flex justify-between items-center pb-4 border-b", style: { borderColor: C.border } },
          h('div', null,
            h('h1', { className: "text-xl font-bold", style: { color: C.text } }, "MAXIMUS BOT"),
            h('span', { className: "text-xs", style: { color: status.running ? C.success : C.muted } }, `● ${status.running ? "Operando" : "Parado"}`)
          ),
          h('button', { onClick: handleLogout, className: "px-3 py-1.5 rounded-lg text-xs font-medium border cursor-pointer", style: { borderColor: C.border, color: C.muted } }, "Sair")
        ),
        h('div', { className: "grid grid-cols-1 md:grid-cols-3 gap-4" },
          h('div', { className: "p-4 rounded-xl border", style: { background: C.surface, borderColor: C.border } },
            h('span', { className: "text-xs block", style: { color: C.muted } }, "Saldo Atual"),
            h('span', { className: "text-2xl font-bold", style: { color: C.text } }, `R$ ${status.current_balance}`)
          ),
          h('div', { className: "p-4 rounded-xl border", style: { background: C.surface, borderColor: C.border } },
            h('span', { className: "text-xs block", style: { color: C.muted } }, "Lucro / Prejuízo"),
            h('span', { className: "text-2xl font-bold", style: { color: profit >= 0 ? C.success : C.danger } }, `R$ ${profit}`)
          ),
          h('div', { className: "p-4 rounded-xl border", style: { background: C.surface, borderColor: C.border } },
            h('span', { className: "text-xs block", style: { color: C.muted } }, "Placar (W / L)"),
            h('span', { className: "text-2xl font-bold", style: { color: C.text } },
              h('span', { style: { color: C.success } }, status.wins), " / ", h('span', { style: { color: C.danger } }, status.losses)
            )
          )
        ),
        h('div', { className: "p-6 rounded-2xl border text-center space-y-4", style: { background: C.surface, borderColor: C.border } },
          h('h2', { className: "text-sm font-semibold", style: { color: C.muted } }, "Status da Operação"),
          h('button', { onClick: toggleBot, disabled: loading, className: "px-8 py-3.5 rounded-full font-bold text-sm cursor-pointer transition-transform active:scale-95", style: { background: status.running ? C.danger : C.success, color: "#000" } },
            loading ? "Aguarde..." : status.running ? "PARAR BOT" : "INICIAR BOT"
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(h(App));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maximus Bot - Painel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#05070D] text-[#E8ECF6] font-sans antialiased m-0">
  <div id="app" class="min-h-screen flex items-center justify-center p-4">
    <!-- Conteúdo injetado via JS puro -->
  </div>

  <script>
    const API_BASE = "/api";
    
    function getToken() {
      return sessionStorage.getItem("maximus_token");
    }

    async function apiFetch(path, options = {}) {
      const { token, method = "GET", body } = options;
      let url = `${API_BASE}${path}`;
      
      let res = await fetch(url, {
        method,
        headers: {
          "Content-Type": "application/json",
          ...(token ? { Authorization: `Bearer ${token}` } : {}),
        },
        body: body ? JSON.stringify(body) : undefined,
      });

      if (res.status === 404) {
        res = await fetch(path, {
          method,
          headers: {
            "Content-Type": "application/json",
            ...(token ? { Authorization: `Bearer ${token}` } : {}),
          },
          body: body ? JSON.stringify(body) : undefined,
        });
      }

      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.message || `Erro ${res.status}`);
      return data;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorDiv = document.getElementById("login-error");
      
      errorDiv.classList.add("hidden");

      try {
        const res = await apiFetch("/auth/login", { method: "POST", body: { email, password } });
        const token = res.token || res.access_token;
        if (!token) throw new Error("Token não retornado");
        sessionStorage.setItem("maximus_token", token);
        renderDashboard();
      } catch (err) {
        errorDiv.textContent = err.message || "Credenciais inválidas";
        errorDiv.classList.remove("hidden");
      }
    }

    function handleLogout() {
      sessionStorage.removeItem("maximus_token");
      renderLogin();
    }

    async function toggleBot() {
      const token = getToken();
      const btn = document.getElementById("btn-toggle");
      btn.textContent = "Aguarde...";
      btn.disabled = true;

      try {
        const statusData = await apiFetch("/status", { token });
        const isRunning = statusData.running === true || statusData.status === 'LIGADO' || statusData.running === 'true';

        const path = isRunning ? "/stop" : "/start";
        await apiFetch(path, { method: "POST", token });
        await renderDashboard();
      } catch (err) {
        alert("Erro ao alterar o bot: " + err.message);
        await renderDashboard();
      }
    }

    async function renderDashboard() {
      const token = getToken();
      if (!token) {
        renderLogin();
        return;
      }

      let status = { running: false, initial_balance: 1000, current_balance: 1000, wins: 0, losses: 0 };
      try {
        const res = await apiFetch("/status", { token });
        status = {
          running: res.running === true || res.status === 'LIGADO' || res.running === 'true',
          initial_balance: res.initial_balance ?? 1000,
          current_balance: res.current_balance ?? res.saldo ?? 1000,
          wins: res.wins ?? 0,
          losses: res.losses ?? 0
        };
      } catch (err) {
        console.error("Erro ao buscar status", err);
      }

      const profit = (status.current_balance - status.initial_balance).toFixed(2);
      const profitColor = profit >= 0 ? "text-[#28C77A]" : "text-[#F0455C]";
      const statusColor = status.running ? "text-[#28C77A]" : "text-[#7C8AA5]";
      const btnBg = status.running ? "bg-[#F0455C]" : "bg-[#28C77A]";
      const btnText = status.running ? "PARAR BOT" : "INICIAR BOT";

      document.getElementById("app").className = "max-w-4xl mx-auto p-4 md:p-6 space-y-6 w-full";
      document.getElementById("app").innerHTML = `
        <header class="flex justify-between items-center pb-4 border-b border-[#20293D]">
          <div>
            <h1 class="text-xl font-bold text-[#E8ECF6]">MAXIMUS BOT</h1>
            <span class="text-xs ${statusColor}">● ${status.running ? "Operando" : "Parado"}</span>
          </div>
          <button id="logout-btn" class="px-3 py-1.5 rounded-lg text-xs font-medium border border-[#20293D] text-[#7C8AA5] cursor-pointer hover:bg-[#141C2E]">
            Sair
          </button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="p-4 rounded-xl border border-[#20293D] bg-[#0E1420]">
            <span class="text-xs block text-[#7C8AA5]">Saldo Atual</span>
            <span class="text-2xl font-bold text-[#E8ECF6]">R$ ${status.current_balance}</span>
          </div>
          <div class="p-4 rounded-xl border border-[#20293D] bg-[#0E1420]">
            <span class="text-xs block text-[#7C8AA5]">Lucro / Prejuízo</span>
            <span class="text-2xl font-bold ${profitColor}">R$ ${profit}</span>
          </div>
          <div class="p-4 rounded-xl border border-[#20293D] bg-[#0E1420]">
            <span class="text-xs block text-[#7C8AA5]">Placar (W / L)</span>
            <span class="text-2xl font-bold text-[#E8ECF6]">
              <span class="text-[#28C77A]">${status.wins}</span> / <span class="text-[#F0455C]">${status.losses}</span>
            </span>
          </div>
        </div>

        <div class="p-6 rounded-2xl border border-[#20293D] bg-[#0E1420] text-center space-y-4">
          <h2 class="text-sm font-semibold text-[#7C8AA5]">Status da Operação</h2>
          <button id="btn-toggle" class="px-8 py-3.5 rounded-full font-bold text-sm cursor-pointer transition-transform active:scale-95 text-black ${btnBg}">
            ${btnText}
          </button>
        </div>
      `;

      document.getElementById("logout-btn").addEventListener("click", handleLogout);
      document.getElementById("btn-toggle").addEventListener("click", toggleBot);
    }

    function renderLogin() {
      document.getElementById("app").className = "min-h-screen flex items-center justify-center p-4 w-full";
      document.getElementById("app").innerHTML = `
        <div class="w-full max-w-sm p-6 rounded-2xl bg-[#0E1420] border border-[#20293D]">
          <h1 class="text-xl font-bold mb-1 text-center text-[#E8ECF6]">MAXIMUS BOT</h1>
          <p class="text-xs text-center mb-6 text-[#7C8AA5]">Acesso ao painel de controle</p>
          
          <div id="login-error" class="p-3 mb-4 rounded-xl text-xs bg-[#F0455C]/10 text-[#F0455C] hidden"></div>
          
          <form id="login-form" class="space-y-4">
            <div>
              <label class="text-xs font-medium block mb-1 text-[#7C8AA5]">E-mail</label>
              <input type="email" id="email" required class="w-full p-3 rounded-xl bg-black/20 outline-none text-sm border border-[#20293D] text-[#E8ECF6]" />
            </div>
            <div>
              <label class="text-xs font-medium block mb-1 text-[#7C8AA5]">Senha</label>
              <input type="password" id="password" required class="w-full p-3 rounded-xl bg-black/20 outline-none text-sm border border-[#20293D] text-[#E8ECF6]" />
            </div>
            <button type="submit" class="w-full py-3 rounded-xl font-bold text-sm cursor-pointer bg-[#3D7FFF] text-black">
              Entrar
            </button>
          </form>
        </div>
      `;

      document.getElementById("login-form").addEventListener("submit", handleLogin);
    }

    // Inicialização
    if (getToken()) {
      renderDashboard();
    } else {
      renderLogin();
    }
  </script>
</body>
</html>
